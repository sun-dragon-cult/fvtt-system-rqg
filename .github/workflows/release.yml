name: Create System Files For GitHub Release

env:
  manifest-file: system.json # Must match the manifest file name declared in Foundry
  system-name: rqg # Must match the system / module name property in the manifest file

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing GitHub release (e.g. v6.1.1)"
        required: true
        type: string
      dry_run:
        description: "Run the Foundry Package Release API in dry-run mode (nothing is saved)"
        required: true
        default: true
        type: boolean

jobs:
  build:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"

      - name: Init dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Code Quality
        run: pnpm check:release

      - name: Verify No Deprecations Are Due
        run: |
          if [ -f buildScripts/check-deprecations.ts ]; then
            pnpm check:deprecations "${GITHUB_REF_NAME#v}"
          else
            echo "::warning::This tag predates buildScripts/check-deprecations.ts, so deprecations aren't checked"
          fi

      - name: Build project
        run: pnpm build

      - name: Update version in manifest file
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s|99999.0.0-localhost|${VERSION}|" "static/${{ env.manifest-file }}"

      - name: Create Zip
        run: |
          mv dist /tmp/${{ env.system-name }}
          cp -f static/${{env.manifest-file}} /tmp/${{ env.system-name }}
          cd /tmp/${{ env.system-name }}
          zip -r ../${{ env.system-name }}.zip *

      - name: Verify Package Contents
        run: |
          # `|| true` is required: grep exits non-zero when it finds no matches, which
          # would abort this step (GitHub runs `run:` under `bash -e`) before the
          # error message below could explain what actually went wrong.
          MANIFEST_PATHS=$(unzip -Z1 /tmp/${{ env.system-name }}.zip | grep -E "(^|/)${{ env.manifest-file }}$" || true)
          MANIFEST_COUNT=$(printf '%s\n' "$MANIFEST_PATHS" | grep -c . || true)

          # Foundry and third-party installers (e.g. The Forge) only expect a manifest at
          # the archive root; extra copies elsewhere break their install/caching. See #1000.
          if [ "$MANIFEST_COUNT" -ne 1 ] || [ "$MANIFEST_PATHS" != "${{ env.manifest-file }}" ]; then
            echo "::error::Expected exactly one ${{ env.manifest-file }} at the root of ${{ env.system-name }}.zip, but found $MANIFEST_COUNT: $MANIFEST_PATHS"
            unzip -Z1 /tmp/${{ env.system-name }}.zip
            exit 1
          fi

          if unzip -p /tmp/${{ env.system-name }}.zip "${{ env.manifest-file }}" | grep -q "99999.0.0-localhost"; then
            echo "::error::${{ env.manifest-file }} in ${{ env.system-name }}.zip still contains the placeholder version 99999.0.0-localhost"
            exit 1
          fi

      # Only attaches the files, so the release's pre-release and latest flags stay as they are
      - name: Attach Files To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}" --clobber
          "/tmp/${{ env.system-name }}.zip" "static/${{ env.manifest-file }}"

  # Runs after the build (registering a release promoted while it was built), on promotion
  # (skipping a release still being built), and by hand.
  register:
    needs: build
    # build is skipped on every other event, so only a failed or cancelled build stops this
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: >-
        register-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false

    steps:
      # A release uses the default branch's script, since an older tag may not have it. A manual
      # run uses its branch's, to try a changed script.
      - name: Checkout Registration Script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: buildScripts/register-foundry-release.ts
          sparse-checkout-cone-mode: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish to Foundry Package Release API
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          TRIGGER: ${{ github.event.action }}
          MANIFEST_FILE: ${{ env.manifest-file }}
          SYSTEM_NAME: ${{ env.system-name }}
        run: node buildScripts/register-foundry-release.ts
