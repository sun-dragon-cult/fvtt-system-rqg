name: Create System Files For GitHub Release

env:
  manifest-file: system.json # Must match the manifest file name declared in Foundry
  system-name: rqg # Must match the system / module name property in the manifest file

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"

      - name: Init dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Code Quality
        run: pnpm check:release

      - name: Build project
        run: pnpm build

      - name: Update version in manifest file
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s|99999.0.0-localhost|${VERSION}|" "static/${{ env.manifest-file }}"

      - name: Create Zip
        run: |
          mv dist /tmp/${{ env.system-name }}
          cp -f static/${{env.manifest-file}} /tmp/${{ env.system-name }}
          cd /tmp/${{ env.system-name }}
          zip -r ../${{ env.system-name }}.zip *

      - name: Verify Package Contents
        run: |
          # `|| true` is required: grep exits non-zero when it finds no matches, which
          # would abort this step (GitHub runs `run:` under `bash -e`) before the
          # error message below could explain what actually went wrong.
          MANIFEST_PATHS=$(unzip -Z1 /tmp/${{ env.system-name }}.zip | grep -E "(^|/)${{ env.manifest-file }}$" || true)
          MANIFEST_COUNT=$(printf '%s\n' "$MANIFEST_PATHS" | grep -c . || true)

          # Foundry and third-party installers (e.g. The Forge) only expect a manifest at
          # the archive root; extra copies elsewhere break their install/caching. See #1000.
          if [ "$MANIFEST_COUNT" -ne 1 ] || [ "$MANIFEST_PATHS" != "${{ env.manifest-file }}" ]; then
            echo "::error::Expected exactly one ${{ env.manifest-file }} at the root of ${{ env.system-name }}.zip, but found $MANIFEST_COUNT: $MANIFEST_PATHS"
            unzip -Z1 /tmp/${{ env.system-name }}.zip
            exit 1
          fi

          if unzip -p /tmp/${{ env.system-name }}.zip "${{ env.manifest-file }}" | grep -q "99999.0.0-localhost"; then
            echo "::error::${{ env.manifest-file }} in ${{ env.system-name }}.zip still contains the placeholder version 99999.0.0-localhost"
            exit 1
          fi

      # Update the GitHub release with the manifest and module archive files.
      - name: Update Release With Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "static/${{env.manifest-file}}, /tmp/${{env.system-name}}.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
