name: Create System Files For GitHub Release

env:
  manifest-file: system.json # Must match the manifest file name declared in Foundry
  system-name: rqg # Must match the system / module name property in the manifest file

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test against Foundry API (without leading v, e.g. 6.1.1)"
        required: true
        type: string
      dry_run:
        description: "Run Foundry Package Release API in dry-run mode (recommended)"
        required: true
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        if: ${{ github.event_name == 'release' }}
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"

      - name: Init dependencies
        if: ${{ github.event_name == 'release' }}
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Code Quality
        if: ${{ github.event_name == 'release' }}
        run: pnpm check:release

      - name: Verify No Deprecations Are Due
        if: ${{ github.event_name == 'release' }}
        run: pnpm check:deprecations "${GITHUB_REF_NAME#v}"

      - name: Build project
        if: ${{ github.event_name == 'release' }}
        run: pnpm build

      - name: Update version in manifest file
        if: ${{ github.event_name == 'release' }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s|99999.0.0-localhost|${VERSION}|" "static/${{ env.manifest-file }}"

      - name: Create Zip
        if: ${{ github.event_name == 'release' }}
        run: |
          mv dist /tmp/${{ env.system-name }}
          cp -f static/${{env.manifest-file}} /tmp/${{ env.system-name }}
          cd /tmp/${{ env.system-name }}
          zip -r ../${{ env.system-name }}.zip *

      - name: Verify Package Contents
        if: ${{ github.event_name == 'release' }}
        run: |
          # `|| true` is required: grep exits non-zero when it finds no matches, which
          # would abort this step (GitHub runs `run:` under `bash -e`) before the
          # error message below could explain what actually went wrong.
          MANIFEST_PATHS=$(unzip -Z1 /tmp/${{ env.system-name }}.zip | grep -E "(^|/)${{ env.manifest-file }}$" || true)
          MANIFEST_COUNT=$(printf '%s\n' "$MANIFEST_PATHS" | grep -c . || true)

          # Foundry and third-party installers (e.g. The Forge) only expect a manifest at
          # the archive root; extra copies elsewhere break their install/caching. See #1000.
          if [ "$MANIFEST_COUNT" -ne 1 ] || [ "$MANIFEST_PATHS" != "${{ env.manifest-file }}" ]; then
            echo "::error::Expected exactly one ${{ env.manifest-file }} at the root of ${{ env.system-name }}.zip, but found $MANIFEST_COUNT: $MANIFEST_PATHS"
            unzip -Z1 /tmp/${{ env.system-name }}.zip
            exit 1
          fi

          if unzip -p /tmp/${{ env.system-name }}.zip "${{ env.manifest-file }}" | grep -q "99999.0.0-localhost"; then
            echo "::error::${{ env.manifest-file }} in ${{ env.system-name }}.zip still contains the placeholder version 99999.0.0-localhost"
            exit 1
          fi

      # Update the GitHub release with the manifest and module archive files.
      - name: Update Release With Files
        if: ${{ github.event_name == 'release' }}
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "static/${{env.manifest-file}}, /tmp/${{env.system-name}}.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

      # Register the release with Foundry VTT once promoted from pre-release to full release (or during manual dry-run).
      - name: Publish to Foundry Package Release API
        if: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch' }}
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || false }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.INPUT_VERSION
              ? process.env.INPUT_VERSION.replace(/^v/, "")
              : process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const dryRun = process.env.IS_DRY_RUN === "true";

            const manifest = JSON.parse(fs.readFileSync("static/" + process.env["manifest-file"], "utf8"));
            const compatibility = {
              minimum: String(manifest.compatibility?.minimum ?? ""),
              verified: String(manifest.compatibility?.verified ?? ""),
            };
            if (manifest.compatibility?.maximum) {
              compatibility.maximum = String(manifest.compatibility.maximum);
            }

            const payload = {
              id: manifest.id,
              ...(dryRun ? { "dry-run": true } : {}),
              release: {
                version,
                manifest: `https://github.com{version}/${process.env["manifest-file"]}`,
                notes: `https://github.io{version}`,
                compatibility,
              },
            };

            console.log("Sending payload:", JSON.stringify(payload, null, 2));

            fetch("https://foundryvtt.com", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": process.env.FOUNDRY_RELEASE_TOKEN,
              },
              body: JSON.stringify(payload),
            })
              .then(async (res) => {
                const data = await res.json();
                console.log("Foundry API response:", JSON.stringify(data, null, 2));
                if (!res.ok || data.status !== "success") {
                  process.exit(1);
                }
              })
              .catch((err) => {
                console.error("Failed to publish to Foundry API:", err);
                process.exit(1);
              });
          '
