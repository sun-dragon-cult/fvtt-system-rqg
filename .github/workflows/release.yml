name: Create System Files For GitHub Release

env:
  manifest-file: system.json # Must match the manifest file name declared in Foundry
  system-name: rqg # Must match the system / module name property in the manifest file

# Publishing a release (or pre-release) builds it and attaches the files (job `build`). Promoting a
# pre-release to a full release registers it with Foundry (job `register`), without rebuilding, so
# what was verified is what is registered. `register` can also be run by hand, e.g. as a dry run.
on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of an existing GitHub release, without the leading v (e.g. 6.1.1)"
        required: true
        type: string
      dry_run:
        description: "Run the Foundry Package Release API in dry-run mode (nothing is saved)"
        required: true
        default: true
        type: boolean

# One run per release at a time, so publishing a full release directly (which fires both events)
# registers it only after its files are attached
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"

      - name: Init dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Code Quality
        run: pnpm check:release

      - name: Verify No Deprecations Are Due
        run: pnpm check:deprecations "${GITHUB_REF_NAME#v}"

      - name: Build project
        run: pnpm build

      - name: Update version in manifest file
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s|99999.0.0-localhost|${VERSION}|" "static/${{ env.manifest-file }}"

      - name: Create Zip
        run: |
          mv dist /tmp/${{ env.system-name }}
          cp -f static/${{env.manifest-file}} /tmp/${{ env.system-name }}
          cd /tmp/${{ env.system-name }}
          zip -r ../${{ env.system-name }}.zip *

      - name: Verify Package Contents
        run: |
          # `|| true` is required: grep exits non-zero when it finds no matches, which
          # would abort this step (GitHub runs `run:` under `bash -e`) before the
          # error message below could explain what actually went wrong.
          MANIFEST_PATHS=$(unzip -Z1 /tmp/${{ env.system-name }}.zip | grep -E "(^|/)${{ env.manifest-file }}$" || true)
          MANIFEST_COUNT=$(printf '%s\n' "$MANIFEST_PATHS" | grep -c . || true)

          # Foundry and third-party installers (e.g. The Forge) only expect a manifest at
          # the archive root; extra copies elsewhere break their install/caching. See #1000.
          if [ "$MANIFEST_COUNT" -ne 1 ] || [ "$MANIFEST_PATHS" != "${{ env.manifest-file }}" ]; then
            echo "::error::Expected exactly one ${{ env.manifest-file }} at the root of ${{ env.system-name }}.zip, but found $MANIFEST_COUNT: $MANIFEST_PATHS"
            unzip -Z1 /tmp/${{ env.system-name }}.zip
            exit 1
          fi

          if unzip -p /tmp/${{ env.system-name }}.zip "${{ env.manifest-file }}" | grep -q "99999.0.0-localhost"; then
            echo "::error::${{ env.manifest-file }} in ${{ env.system-name }}.zip still contains the placeholder version 99999.0.0-localhost"
            exit 1
          fi

      # Update the GitHub release with the manifest and module archive files.
      - name: Update Release With Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "static/${{env.manifest-file}}, /tmp/${{env.system-name}}.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

  # Registers the version with Foundry once a pre-release is promoted, from the manifest attached to
  # the GitHub release: it checks out nothing, so a run can't use the wrong branch's compatibility.
  register:
    if: ${{ (github.event_name == 'release' && github.event.action == 'released') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish to Foundry Package Release API
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MANIFEST_FILE: ${{ env.manifest-file }}
          SYSTEM_NAME: ${{ env.system-name }}
        run: |
          node - <<'NODE'
          const API_URL = "https://foundryvtt.com/_api/packages/release_version/";
          const env = process.env;
          const version = (env.VERSION ?? "").replace(/^v/, "");
          const dryRun = env.DRY_RUN === "true";
          const manifestUrl = `https://github.com/${env.GITHUB_REPOSITORY}/releases/download/v${version}/${env.MANIFEST_FILE}`;
          const notesUrl = `https://sun-dragon-cult.github.io/release-notes/${env.SYSTEM_NAME}-v${version}`;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };

          async function fetchOk(url, options, attempts = 5) {
            let last = "";
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response = await fetch(url, options);
                if (response.ok) {
                  return response;
                }
                last = `HTTP ${response.status}`;
              } catch (error) {
                last = String(error);
              }
              if (attempt < attempts) {
                await sleep(10_000);
              }
            }
            return fail(`${url} is not available: ${last}`);
          }

          async function main() {
            if (!version) {
              fail("No version to register.");
            }
            if (!env.FOUNDRY_RELEASE_TOKEN) {
              fail("The FOUNDRY_RELEASE_TOKEN secret is not set (see Releasing in the README).");
            }

            // A real registration is only for a published release; a dry run may try anything
            const github = await fetch(
              `https://api.github.com/repos/${env.GITHUB_REPOSITORY}/releases/tags/v${version}`,
              { headers: { Authorization: `Bearer ${env.GITHUB_TOKEN}`, Accept: "application/vnd.github+json" } },
            );
            if (!github.ok) {
              fail(`No GitHub release for tag v${version} (HTTP ${github.status}).`);
            }
            const release = await github.json();
            if (!dryRun && (release.prerelease || release.draft)) {
              fail(`v${version} is a ${release.draft ? "draft" : "pre-release"}: promote it before registering.`);
            }

            // What Foundry users will install: the manifest uploaded to the release, not the one on a branch
            const manifest = await (await fetchOk(manifestUrl)).json();
            if (manifest.version !== version) {
              fail(`${manifestUrl} has version ${manifest.version}, not ${version}.`);
            }
            const compatibility = {
              minimum: String(manifest.compatibility?.minimum ?? ""),
              verified: String(manifest.compatibility?.verified ?? ""),
              ...(manifest.compatibility?.maximum ? { maximum: String(manifest.compatibility.maximum) } : {}),
            };

            const notes = await fetch(notesUrl, { method: "HEAD" }).catch(() => undefined);
            if (!notes?.ok) {
              console.log(`::warning::The release notes are not live yet: ${notesUrl}`);
            }

            const payload = {
              id: manifest.id,
              ...(dryRun ? { "dry-run": true } : {}),
              release: { version, manifest: manifestUrl, notes: notesUrl, compatibility },
            };
            console.log("Sending payload:", JSON.stringify(payload, null, 2));

            const post = () =>
              fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", Authorization: env.FOUNDRY_RELEASE_TOKEN },
                body: JSON.stringify(payload),
              });
            let response = await post();
            if (response.status === 429) {
              const wait = Math.min(Number(response.headers.get("Retry-After")) || 60, 120);
              console.log(`Rate limited, trying again in ${wait} s`);
              await sleep(wait * 1000);
              response = await post();
            }

            const text = await response.text();
            let data;
            try {
              data = JSON.parse(text);
            } catch {
              return fail(`Foundry answered HTTP ${response.status} with no JSON: ${text.slice(0, 300)}`);
            }
            console.log("Foundry API response:", JSON.stringify(data, null, 2));
            if (response.ok && data.status === "success") {
              return;
            }
            // The same version again (a pre-release promoted twice) is already registered, not an error
            if (data.errors?.__all__?.some((e) => e.code === "unique_together")) {
              console.log(`::warning::Version ${version} is already registered with Foundry.`);
              return;
            }
            fail(`Foundry rejected the release (HTTP ${response.status}).`);
          }

          main().catch((error) => fail(String(error)));
          NODE
